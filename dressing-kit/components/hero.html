<!--
  Hero pattern — Felon Luv / Magickqal first viewport
  Brand-first. One headline, one lede, one CTA group.
  Atmosphere layer is decorative (aria-hidden).
  Requires: dressing.css
-->
<header class="dk-hero dk-sweep" id="top">
  <div class="dk-atmosphere" aria-hidden="true">
    <span class="dk-orb dk-orb--gold" style="--orb-size:160px; --orb-dur:32s; top:8%; left:12%;"></span>
    <span class="dk-orb dk-orb--phantom" style="--orb-size:120px; --orb-dur:26s; --orb-delay:-8s; top:22%; right:14%;"></span>
    <span class="dk-orb" style="--orb-size:90px; --orb-dur:22s; --orb-delay:-4s; bottom:28%; left:40%;"></span>
    <span class="dk-wisp" style="--wisp-w:220px; --wisp-dur:18s; top:35%; left:5%;"></span>
    <span class="dk-wisp" style="--wisp-w:160px; --wisp-dur:14s; --wisp-delay:-6s; top:55%; right:8%;"></span>
    <span class="dk-mote" style="top:18%; left:30%; --mote-delay:0s;"></span>
    <span class="dk-mote dk-mote--phantom" style="top:42%; left:70%; --mote-delay:-1.5s;"></span>
    <span class="dk-mote" style="top:60%; left:22%; --mote-delay:-3s; --mote-size:3px;"></span>
    <span class="dk-mote" style="top:25%; left:55%; --mote-delay:-2s; --mote-dur:6s;"></span>
  </div>
  <div class="dk-hero__veil" aria-hidden="true"></div>
  <div class="dk-hero__copy">
    <p class="dk-hero__sister">Maven Dex Corps · Sister hall</p>
    <!-- Swap brand class: plain for Felon Luv, --magickqal for Magickqal -->
    <p class="dk-hero__brand dk-hero__brand--magickqal">Magickqal</p>
    <h1 class="dk-hero__headline">A swanky hall where magical people meet</h1>
    <p class="dk-hero__lede">
      Candelabra light, velvet walls, and company that knows the craft.
      Wicked, wild, wonderful — dressed to linger.
    </p>
    <div class="dk-hero__cta">
      <a class="dk-btn dk-btn--luster" href="#spirits">Enter the hall</a>
      <a class="dk-btn dk-btn--ghost" href="#draw">Draw a card</a>
    </div>
  </div>
</header>
